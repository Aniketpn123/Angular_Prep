<h1>style binding</h1>

<p [style.color]="textColor">color</p>
<p [style.font-size]="fontSize">font size</p>
<div
  [ngStyle]="{
    color:'white,
    backgroundColor:'black',
    padding:'10px'
}"
>
  content
</div>

<!-- Interpolation → Display Data Property Binding → Set DOM Properties Event Binding → Handle User
Events Two-Way Binding → Sync Data Both Ways Class Binding → Apply CSS Classes Style Binding → Apply
Inline Styles -->
